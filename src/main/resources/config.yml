# =============================================
# CH-TradeLock 설정 파일 v1.5
# =============================================

# 로어에 "거래불가"가 포함된 아이템을 허용할 GUI 이름 목록
# GUI 제목에 아래 문자열이 포함되면 이동 허용 (부분 일치)
whitelisted-guis:
  - "예시 GUI"

# 거래불가 아이템을 손에 들고 사용 시 차단할 명령어 목록
# 슬래시(/) 없이 입력, 대소문자 구분 없음
blocked-commands:
  - "ah"
  - "유상"
  - "장터"
  - "유저상점"
  - "dbtkd"
  - "dbwjtkdwja"
  - "wkdxj"

# =============================================
# 사망 보호 (구 인벤세이브권.sk 스크립트를 대체)
# 처리 순서 : 보호 월드 -> 인벤세이브권 -> 거래불가 아이템만 보호
# =============================================
death-protection:
  # 이 월드에서 죽으면 인벤토리와 경험치를 모두 유지 (월드 이름 정확히)
  protected-worlds:
    - "dun"
    - "tuto"
    - "boss"
  # 초심자의 행운 : 총 플레이 시간이 이 시간(시간 단위) 미만이면 죽어도 인벤토리/경험치 유지 (0 = 끔)
  beginner-luck-hours: 3
  # true : 인벤세이브권 사용 시 1개 소모 / false : 가지고만 있으면 계속 보호
  consume-ticket: true
  # true 면 사망할 때마다 콘솔에 처리 과정을 출력 (인벤세이브권이 안 먹힐 때 원인 확인용)
  debug: false
  # 인벤세이브권 아이템 - /invsave set 으로 손에 든 아이템을 저장하세요 (직접 수정하지 마세요)
  ticket-item: null
